services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "${PIHOLE_HOST_IP}:53:53/tcp"
      - "${PIHOLE_HOST_IP}:53:53/udp"
      - "${PIHOLE_HOST_IP}:18080:80/tcp"
    environment:
      # Pi-hole v6 FTL Configuration
      FTLCONF_dns_listeningMode: 'all'
      FTLCONF_dns_bogusPriv: 'false'
      FTLCONF_dns_domainNeeded: 'true'
      FTLCONF_webserver_api_password: '${ADMIN_PASSWORD:-admin}'
      FTLCONF_misc_etc_dnsmasq_d: 'true'
      FTLCONF_webserver_interface_theme: 'default-light'
      FTLCONF_dns_queryLogging: 'true'
      # Rate limit raised from the 1000/60s default: all tailnet devices' DNS arrives
      # via the tailscaled DoH proxy as a single client (the host LAN IP), sharing one
      # bucket, so bulk DNS (e.g. a large pacman upgrade) tripped REFUSED replies.
      FTLCONF_dns_rateLimit_count: '10000'
      FTLCONF_dns_rateLimit_interval: '60'
      # Upstream resolvers (semicolon-separated): Google primary + Cloudflare backup
      FTLCONF_dns_upstreams: '8.8.8.8;8.8.4.4;1.1.1.1'

      # Persistence helper for legacy lookups if needed
      DNS1: '8.8.8.8'
      TZ: 'UTC'
      VIRTUAL_HOST: 'pihole'
      ServerIP: '0.0.0.0'
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'

    cap_add:
      - NET_ADMIN
    restart: always
    networks:
      - pihole_network
    dns:
      - 8.8.8.8

networks:
  pihole_network:
    driver: bridge
